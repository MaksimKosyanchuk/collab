services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'

  redis:
    ports:
      - '${REDIS_HOST_PORT:-6380}:6379'

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - '${MINIO_HOST_PORT:-9002}:9000'
      - '${MINIO_CONSOLE_HOST_PORT:-9003}:9001'

  meilisearch:
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_API_KEY}
    ports:
      - '${MEILI_HOST_PORT:-7701}:7700'

  backend:
    environment:
      NODE_ENV: staging
      APP_ENV: staging
      CLIENT_URL: ${CLIENT_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      MEILI_API_KEY: ${MEILI_API_KEY}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    ports:
      - '${BACKEND_HOST_PORT:-3011}:3001'

  collab:
    environment:
      NODE_ENV: staging
      APP_ENV: staging
      CLIENT_URL: ${CLIENT_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    ports:
      - '${COLLAB_HOST_PORT:-3012}:3002'

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    environment:
      NODE_ENV: staging
      APP_ENV: staging
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    ports:
      - '${FRONTEND_HOST_PORT:-3010}:3000'
