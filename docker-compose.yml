services:
  postgres:
    image: postgres:16-alpine
    container_name: collab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: collab
    ports:
      - '5432:5432'
    volumes:
      - collab_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d collab']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: collab-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - collab_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: collab-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - collab_minio_data:/data

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: collab-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: collab_meili_key
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '7700:7700'
    volumes:
      - collab_meilisearch_data:/meili_data
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '-',
          'http://127.0.0.1:7700/health',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: collab-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_ENV: ${APP_ENV:-development}
      PORT: 3001
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/collab?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEILI_HOST: http://meilisearch:7700
      MEILI_API_KEY: collab_meili_key
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
      MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT:-9000}
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio12345
      MINIO_BUCKET: collab
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-change-me-revalidate}
      NEXT_REVALIDATE_URL: http://frontend:3000/api/revalidate
    ports:
      - '3001:3001'
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '-',
          'http://127.0.0.1:3001/metrics',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  collab:
    build:
      context: ./backend
      dockerfile: Dockerfile.collab
    container_name: collab-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_ENV: ${APP_ENV:-development}
      COLLAB_PORT: 3002
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/collab?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '3002:3002'
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '-',
          'http://127.0.0.1:3002/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3002/collab}
    container_name: collab-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      collab:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_ENV: ${APP_ENV:-development}
      INTERNAL_API_URL: http://backend:3001
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-change-me-revalidate}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3002/collab}
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '-',
          'http://127.0.0.1:3000/',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  collab_postgres_data:
  collab_redis_data:
  collab_minio_data:
  collab_meilisearch_data:
